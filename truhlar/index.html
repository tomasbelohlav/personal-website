<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Truhlář 1 – studijní aplikace</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:#f7f8fa;color:#1c2734;display:flex;flex-direction:column}
.toolbar{display:flex;gap:8px;align-items:center;padding:9px 14px;min-height:58px;border-bottom:1px solid #d9dee5;background:white;flex-wrap:wrap}
.title{font-size:15px;font-weight:700;margin-right:auto}.hint{font-size:12px;color:#64748b}
button{font:inherit;cursor:pointer;border-radius:8px;background:#f2f4f7;border:1px solid #d5dce4;color:inherit;padding:8px 11px;font-size:13px}
button:hover{background:#e7ecf3}button:focus-visible{outline:3px solid #6aa9fa}
.workspace{display:flex;flex:1;min-height:0;position:relative}
#reader{width:100%;height:100%;border:0;background:white;flex:1;min-width:0}
#questions{width:min(490px,45vw);overflow:auto;border-left:1px solid #d9dee5;background:#fff;padding:18px 21px;display:none}
#questions.open{display:block}
.q-head{display:flex;align-items:center;gap:8px;position:sticky;top:-18px;background:inherit;padding:12px 0;z-index:2}
.q-head strong{margin-right:auto}
.q-section{border-top:1px solid #dce2e9;padding:13px 0}
.q-section summary{font-weight:650;cursor:pointer;line-height:1.4}
.q-section small{display:block;color:#64748b;font-size:12px;padding-top:3px;font-weight:400}
.qa{margin:14px 0 18px;line-height:1.55}
.qa b{font-size:14px;display:block;margin-bottom:6px}
.qa p{margin:0;color:#405064;font-size:14px}
#status{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.dark{background:#111a27;color:#e5edf7}
body.dark .toolbar,body.dark #questions{background:#192434;border-color:#34465b}
body.dark button{background:#28384d;color:#edf3fb;border-color:#415771}
body.dark .qa p,body.dark .hint,body.dark .q-section small{color:#b3c0d1}
body.dark .q-section{border-color:#36485e}
@media(max-width:850px){#questions{position:absolute;right:0;top:0;bottom:0;width:min(100%,490px);box-shadow:-5px 0 18px #0002;z-index:4}#status{display:none}.title{width:100%}}


.toolbar{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;min-height:0;flex-wrap:nowrap}
.toolbar-main{display:flex;align-items:center;gap:5px;padding:6px 9px;min-height:46px;flex-wrap:nowrap;white-space:nowrap}
.toolbar-main button{flex:0 0 auto;padding:7px 9px;min-width:34px;font-size:13px}
.toolbar-main #toggleContents{font-weight:650}
.toolbar .hint,.toolbar .title,#undo{display:none!important}
#contentsRow{display:none;align-items:center;gap:8px;border-top:1px solid #d9dee5;padding:6px 10px;background:inherit}
#contentsRow.open{display:flex}
#chapterSearch{width:145px;min-width:85px;flex:0 1 145px;padding:7px 8px;border:1px solid #ccd5df;border-radius:7px;font:inherit;font-size:13px;background:inherit;color:inherit}
#chapterScroller{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow-x:auto;scrollbar-width:thin;min-width:0;flex:1}
#chapterScroller button{flex:0 0 auto;font-size:12px;padding:6px 10px;border-radius:20px}
#chapterScroller button[hidden]{display:none}
body.dark #contentsRow{border-color:#34465b}
body.dark #chapterSearch{border-color:#475569;background:#243349;color:white}
@media(max-width:850px){.toolbar{flex-wrap:nowrap}.toolbar-main{gap:4px;padding:5px 6px}.toolbar-main button{min-width:31px;padding:7px 6px}#chapterSearch{flex:0 0 102px;width:102px}#contentsRow{padding:6px;gap:5px}}

/* Desktop layout: full-width reader, toolbar with title and non-shrinking Q&A drawer. */
@media (min-width:851px){
 .toolbar{flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap;gap:10px;padding:9px 18px;min-height:64px}
 .toolbar .title{display:block!important;order:-1;flex:1 1 auto;font-size:17px;white-space:nowrap;margin:0}
 .toolbar .title .hint{display:inline!important;font-size:12px;font-weight:400}
 .toolbar-main{order:1;flex:0 0 auto;gap:8px;min-height:0;padding:0}
 .toolbar-main button{min-width:40px;font-size:14px;padding:9px 12px}
 .toolbar #status{display:block!important;order:2;max-width:230px;font-size:12px}
 #contentsRow{order:3;flex:1 0 100%;width:100%;padding:10px 0 2px}
 #chapterScroller button{font-size:13px;padding:7px 12px}
 #chapterSearch{width:195px;flex:0 0 195px}
 #questions{position:absolute;right:0;top:0;bottom:0;width:min(460px,42vw);max-width:100%;box-shadow:-5px 0 18px #0002;z-index:5}
 #reader{flex:1 1 100%;width:100%;min-width:0}
}
</style></head>

<header class="toolbar">
 <div class="toolbar-main">
  <button id="toggleContents" aria-expanded="false" aria-controls="contentsRow">Obsah ▾</button>

  <div id="questionList"></div>
 </aside>

<script>
(() => {
'use strict';
const DATA=[{"name":"Vstupní školení BOZP","page":"str. 15","qa":[["Jak poskytnete první pomoc při úrazu?","Zajistím bezpečnost, zjistím stav postiženého a dýchání, zavolám 155 a řídím se operátorem. Při zástavě normálního dýchání zahájím resuscitaci; u krvácení použiji přímý tlak."],["Co je to integrovaný záchranný systém?","Koordinovaná spolupráce hasičů, zdravotnické záchranné služby, Policie ČR a dalších složek při mimořádných událostech."],["Uveďte telefonní čísla pro tísňová volání.","150 hasiči, 155 zdravotnická záchranná služba, 158 Policie ČR, 156 městská policie, 112 jednotné evropské číslo."],["Na co se nesmí použít vodní hasicí přístroj?","Zejména na zařízení pod elektrickým napětím, hořlavé kapaliny a hořící kovy; hasivo musí odpovídat třídě požáru."]]},{"name":"2.2 Měřicí a rýsovací pomůcky","page":"str. 27","qa":[["Jak zjišťujeme kolmost úhelníků?","Porovnáním dvou přesných úhelníků přiložených k sobě, případně kontrolním překlápěním úhelníku u téže rysky."],["K čemu slouží rejsek?","K rýsování čar rovnoběžných s hranou dílce ve zvolené vzdálenosti."],["Nastavte na posuvném měřítku hodnoty 20,5; 30,7 a 27,4 mm.","Nastavím požadované celé milimetry na hlavní stupnici a desetiny podle nonia; prakticky předvedu 20,5; 30,7 a 27,4 mm."],["S jakou přesností měříme v nábytkářství?","Podle učebnice běžně na 1 mm; u přesných spojů a dílců se používá i jemnější měření."]]},{"name":"2.3 Řezání, ruční pily","page":"str. 36","qa":[["Jaké jsou druhy rámových pil?","Rozsečky, osazovačky a vykružovačky."],["K čemu slouží ocaska?","K ručnímu dělení větších dílců, obvykle přímými řezy."],["Jakou pilu užijeme k osazení čepů a výrobě ozubů?","Jemnozubou osazovačku nebo čepovku."],["Jaké jsou zásady pro broušení pilového listu?","Pevně upnout list, trojúhelníkovým pilníkem rovnoměrně ostřit čela zubů, zachovat stejnou výšku zubů (hrotnici), správný tvar a rozvod."],["Co je to hrotnice?","Pomyslná linie spojující hroty pilových zubů; hroty musí mít stejnou výšku."],["Která část pilového listu je hřbet?","Hřbet zubu je jeho šikmá plocha za čelem zubu, opačná vůči řezné čelní ploše."],["Jak vznikají úrazy při práci s pilami?","Nejčastěji vyskočením pily z řezu, neopatrným vedením u ruky, špatným upnutím dílce a nebezpečným odkládáním pily."]]},{"name":"2.4 Hoblování, hoblíky","page":"str. 44","qa":[["Popište jednotlivé části hoblíku.","Tělo, plaz, lůžko, ústí pro třísky, želízko, klín, kolík/úchop a zadní část k držení; u některých hoblíků klopka."],["Ukažte na želízku čelo, hřbet, břit a fazetu.","Čelo a hřbet jsou dvě plochy želízka, jejich průsečnicí je břit; fazeta je vybroušená šikmá plocha u ostří."],["Proč je nutné vlhčit obtahovací kámen?","Kvůli odvádění kovových částeček, snížení zanášení kamene a plynulému obtahování; kapalina musí odpovídat druhu kamene."],["Popište a předveďte obtahování želízka.","Na rovném vhodně zvlhčeném kameni držím stálý úhel fazety, rovnoměrně obtahuji, odstraňuji otřep z druhé strany a dokončím na jemném kameni."],["Jaké nebezpečí pro broušený nástroj vzniká při práci na elektrické brusce?","Přehřátí a popuštění kalené oceli, tedy ztráta tvrdosti břitu a jeho poškození."],["Jakou bezpečnostní pomůcku používáme při práci na elektrické brusce?","Především ochranné brýle nebo vhodný obličejový štít."]]},{"name":"2.4 Hoblování, hoblíky","page":"str. 48","qa":[["Na kterou stranu pokládáme dřevo při počátku hoblování?","Podle učebnice upínáme dílec levou stranou, tj. stranou bližší ke kůře, směrem k ploše hoblice."],["Vyjmenujte základní druhy hoblíků.","Uběrák, hladík, klopkař, římsovník; dále například macek, cidič, zubák a drážkovník."],["K čemu slouží uběrák?","K hrubému úběru materiálu a prvnímu srovnání nerovných ploch."],["Co je to klopka a k čemu slouží?","Příložná část želízka, která láme třísku těsně za břitem a zmenšuje vytrhávání vláken."],["Pokládáme hoblíky na plaz?","Ne. Ostří by se mohlo poškodit; hoblík odkládáme bezpečně na bok nebo tak, aby břit neležel na podložce."]]},{"name":"2.5 Dlabání, dláta","page":"str. 52","qa":[["Vyjmenujte druhy dlát.","Plochá, čepovací (děropáče) a dutá dláta."],["Jak brousíme dláta?","Brousíme fazetu při správném úhlu, nepřehříváme ostří a obtahováním na kameni odstraníme otřep; rohy u plochého dláta zachováme ostré."],["Jaké jsou bezpečnostní zásady při práci s dláty?","Dílec pevně upnout, dláto nikdy nevést proti ruce či tělu, používat paličku a nástroj odkládat ostřím od sebe."]]},{"name":"2.6 Vrtání, nástroje k vrtání","page":"str. 57","qa":[["Vyjmenujte alespoň čtyři vrtáky, které používáme při vrtání do dřeva.","Špulíř, hadovitý, plochý, šroubovitý a Forstnerův vrták."],["Je vhodné vrtat do dřeva vrtákem do železa? A proč?","Lze, ale není to ideální: obvykle chybí vodicí hrot a předřezávače, vrták může uhýbat a vytrhávat vlákna."],["Jaké mohou vzniknout úrazy při práci s vrtáky?","Zaseknutý vrták může roztočit neupnutý dílec, případně může dojít k poranění rotujícím nástrojem a třískami."]]},{"name":"2.7 Pilování a rašplování","page":"str. 61","qa":[["Můžeme použít pilník nebo struhák pro páčení a proč?","Ne. Nástroje jsou tvrdé, ale křehké a při páčení mohou prasknout."],["Jak vyčistíme zalepený pilník nebo struhák?","Ocelovým kartáčem; pryskyřici lze odstranit vhodným čistícím prostředkem podle materiálu a bezpečnostních pokynů."]]},{"name":"2.8 Broušení","page":"str. 65","qa":[["Proč brousíme dřevo?","Abychom odstranili drobné nerovnosti, sjednotili povrch a připravili jej na povrchovou úpravu."],["Jaké brusné prostředky použijeme pro broušení dřeva?","Brusný papír či plátno, brusné houbičky, mřížky a pro některé účely brusnou vlnu."],["Jaké zrnitosti brusných prostředků použijeme pro hrubé, jemné broušení a pro broušení tmelů a laků?","Podle učebnice hrubé P60–90, jemnější P100–180, laky a tmely P220–400; konkrétní zrnitost závisí na podkladu a systému úpravy."]]},{"name":"3.1 Spojování spojovacími prostředky","page":"str. 76","qa":[["Je spoj pomocí hřebíku rozebíratelný?","Učebnice ho řadí mezi mechanické rozebíratelné spoje, avšak rozebrání často poškodí dílce; v praxi nejde o běžně opakovaně demontovatelný spoj."],["Kde je vhodné použít spojení na vrut a váleček, jedná se o nerozebíratelný spoj?","Například pro skříňový a sezonní zahradní nábytek; jde o pevný, ale rozebíratelný spoj."],["Jak vypadá hlavička běžně používaného vrutu?","Často zápustná s křížovou drážkou; podle účelu může být také čočková nebo půlkulatá."],["Do jaké hloubky předvrtáváme otvor pro vruty, jaký použijeme průměr vrtáku?","Učebnice uvádí pro větší vruty předvrtání zhruba do 3/4 délky vrutu; současná praxe volí průměr podle jádra vrutu a výrobce, nikoli univerzálně podle vnějšího průměru."],["Proč je dřevěný kolík rýhovaný?","Rýhy rozvádějí lepidlo a umožňují jeho rovnoměrné rozložení ve spoji."],["Popište výhody a nevýhody spojení pomocí vloženého pera (lamely).","Výhody: snadné přesné sesazení a zpevnění spojení; nevýhody: potřeba lamelovací frézky a vyšší cena lamel oproti kolíkům."]]},{"name":"3.3 Plošné spoje","page":"str. 83","qa":[["Co je to spárovka?","Masivní plošná deska vytvořená slepením užších přířezů po hranách."],["Jaké platí zásady pro výrobu spárovky?","Vybrat vhodné a stejně vysušené dílce, správně orientovat letokruhy, vytvořit rovné styčné hrany, rovnoměrně nanést lepidlo, stáhnout a kontrolovat rovinnost."]]},{"name":"3.4 Rámy","page":"str. 108","qa":[["Vyjmenujte druhy rohových rámových spojů.","Například čep a rozpor, čep a dlab, čep s perem a dlab, přeplátování, kolíkový a ozubový spoj."],["Kde provádíme spoj na čep a dlab?","U rámových konstrukcí, například nábytkových rámů, dveří a sedacího nábytku."],["Budeme vyrábět dlab či rozpor o šířce 7, 13 mm, proč?","Takové rozměry nejsou vhodné pro běžná standardní dláta. Šířku se snažíme navrhnout podle dostupného dláta a technologických možností, aby vznikl přesný dlab."],["Vyjmenujte spoje na ozuby a uveďte použití.","Otevřené, polokryté a celokryté ozuby; používají se zejména u rohů zásuvek a skříňových konstrukcí."],["Co jsou to rybinové ozuby?","Lichoběžníkové ozuby se šikmými boky, které vytvoří pevný spoj odolávající vytažení."]]},{"name":"4.1 Technologická příprava dřeva","page":"str. 121","qa":[["Co to je plastifikace?","Dočasné změkčení dřeva teplem a vlhkostí, které usnadňuje tvarování či výrobu dýh."],["Jaké druhy plastifikace znáte?","Například paření a vaření; používá se vlhké teplo."],["Popište proces přirozeného vysoušení řeziva a kde se vysoušení provádí.","Řezivo se skládá do hrání na proklady na větraném, před deštěm chráněném místě; vysychá okolním vzduchem."],["Popište proces umělého vysoušení řeziva a kde se vysoušení provádí.","V sušárnách se řídí teplota, vlhkost a proudění vzduchu podle sušicího režimu."],["Jaké nebezpečí z hlediska PO vzniká v dřevařských provozech?","Požár a výbuch hořlavého prachu, pilin a odřezků; riziko zvyšují zdroje zapálení a nevhodné skladování."],["Před jakými škodlivými vlivy chráníme dřevo?","Před nadměrnou vlhkostí, dřevokaznými houbami, plísněmi, hmyzem, povětrností a ohněm."],["Jaké druhy ochrany dřeva znáte? Popište je.","Konstrukční ochrana omezuje kontakt s vodou a umožňuje vysychání; chemická využívá vhodné ochranné prostředky podle prostředí a účelu."],["Vyjmenujte alespoň 3 zásady konstrukční ochrany dřeva.","Zabránit zadržování vody, zajistit odvětrávání a odtok vody, oddělit dřevo od země a použít vhodné přesahy a krytí."]]},{"name":"4.2 Pilařská výroba","page":"str. 127","qa":[["Vyjmenujte sortiment pilařské výroby.","Prkna, fošny, hranoly, hranolky, latě a lišty; řezivo se dělí na nehraněné, hraněné a drobné."]]},{"name":"4.3 Výroba dýh a překližek","page":"str. 131","qa":[["Co je to plastifikace výřezů a kterou složku plastifikujeme?","Působení tepla a vlhkosti pro změkčení dřeva před loupáním a krájením; ovlivňuje se především lignin v buněčných stěnách."],["Vyjmenujte způsoby výroby dýh.","Řezáním, loupáním a krájením."],["Popište zjednodušeně výrobu překližek.","Dýhy se připraví a vysuší, nanese se lepidlo, vrstvy se sestaví zpravidla s křížením vláken, lisují se a desky se dokončí."]]},{"name":"4.4 Výroba laťovek","page":"str. 133","qa":[["Čím je tvořena laťovka?","Laťovkovým středem oboustranně překlíženým dýhou."],["Jaké druhy středů rozeznáváme u laťovek?","Středy nelepené a lepené, tvořené jednotlivými dřevěnými prvky."],["Jaké materiály se používají u laťovek s lepenými středy?","Pro střed se používají zejména dřevěné laťky nebo další vhodné dřevní prvky podle technologie výrobce."]]},{"name":"4.5 Aglomerované materiály","page":"str. 143","qa":[["Co jsou aglomerované materiály?","Deskové výrobky ze dřevních částic, štěpek nebo vláken spojených pojivy a lisováním."],["Co to je OSB deska?","Deska z orientovaných velkých dřevních štěpek, vrstvených a slisovaných s pojivem."],["Jak se vyrábí MDF deska?","Dřevo se rozvlákní, vlákna se smísí s pojivem, vytvoří se koberec a za tepla se slisuje do středně husté desky."]]}];
const frame=document.querySelector('#reader'),themeBtn=document.querySelector('#theme'),panel=document.querySelector('#questions'),qBtn=document.querySelector('#toggleQuestions'),status=document.querySelector('#status');
let storage='truhlar1.highlights.v2',themeKey='truhlar1.theme.v1';
let marks=[],history=[],dark=false,doc=null,refreshTimer=null,painting=false;
try{marks=JSON.parse(localStorage.getItem(storage)||'[]');if(!Array.isArray(marks))marks=[];dark=localStorage.getItem(themeKey)==='dark'}catch(e){marks=[]}
const save=()=>{try{localStorage.setItem(storage,JSON.stringify(marks))}catch(e){status.textContent='Zvýraznění nelze uložit.'}};
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#questionList').innerHTML=DATA.map((sec,i)=>
 '<details class="q-section" '+(i===0?'open':'')+'><summary>'+esc(sec.name)+'<small>'+esc(sec.page)+'</small></summary>'+
 sec.qa.map(([q,a],j)=>'<div class="qa"><b>'+(j+1)+'. '+esc(q)+'</b><p>'+esc(a)+'</p></div>').join('')+'</details>'
).join('');
function toggleQuestions(on){

function nodes(){
 if(!doc)return [];
 const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
 const a=[];let n;
 while(n=w.nextNode()){
  if(n.parentElement?.closest('script,style,noscript,textarea,svg'))continue;
  a.push(n);
 }
 return a;
}
function offsets(range){
 let start=-1,end=-1,count=0;
 for(const n of nodes()){
  if(n===range.startContainer)start=count+range.startOffset;
  if(n===range.endContainer)end=count+range.endOffset;
  // Range boundaries can be elements, such as a selected whole paragraph.
  const nr=doc.createRange();nr.selectNodeContents(n);
  if(start<0 && range.compareBoundaryPoints(Range.START_TO_START,nr)<=0 && range.compareBoundaryPoints(Range.END_TO_END,nr)>0)start=count;
  if(end<0 && range.compareBoundaryPoints(Range.END_TO_END,nr)>=0 && range.compareBoundaryPoints(Range.START_TO_START,nr)<0)end=count+n.length;
  count+=n.length;
 }
 if(start<0||end<=start)return null;
 return [start,end];
}
function rangeAt(from,to){
 const all=nodes();let start=null,end=null,pos=0;
 for(const n of all){
  if(start===null&&from>=pos&&from<=pos+n.length)start=[n,from-pos];
  if(to>=pos&&to<=pos+n.length){end=[n,to-pos];break}
  pos+=n.length;
 }
 if(!start||!end)return null;
 const r=doc.createRange();
 try{r.setStart(...start);r.setEnd(...end);return r}catch(e){return null}
}
function clearOldMarks(){
 if(!doc)return;
 const old=[...doc.querySelectorAll('mark.study-user-highlight')];
 for(const el of old)el.replaceWith(doc.createTextNode(el.textContent));
}
function fallbackPaint(){
 clearOldMarks();
 // Use stable text offsets; perform in reverse order to avoid invalidating earlier offsets.
 for(const m of [...marks].sort((a,b)=>b.from-a.from)){
  let base=0;const ns=nodes().map(n=>{const x={n,from:base,to:base+n.length};base+=n.length;return x});
  for(let i=ns.length-1;i>=0;i--){
   const {n,from,to}=ns[i];if(to<=m.from||from>=m.to)continue;
   let piece=n;const a=Math.max(0,m.from-from),b=Math.min(n.length,m.to-from);
   if(b<piece.length)piece.splitText(b);
   if(a>0)piece=piece.splitText(a);
   const mark=doc.createElement('mark');mark.className='study-user-highlight';
   piece.replaceWith(mark);mark.appendChild(piece);
  }
 }
}
function paint(){
 if(!doc||painting)return;painting=true;
 try{
  if(doc.defaultView.CSS?.highlights && doc.defaultView.Highlight){
   clearOldMarks();
   const ranges=marks.map(m=>rangeAt(m.from,m.to)).filter(Boolean);
   doc.defaultView.CSS.highlights.set('study-user',new doc.defaultView.Highlight(...ranges));
  }else fallbackPaint();
  status.textContent=marks.length+' zvýraznění · opakovaný výběr je odstraní';
 }finally{painting=false}
}
function choose(){
 if(!doc)return;
 const sel=doc.getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return;
 const r=sel.getRangeAt(0);
 if(!doc.body.contains(r.commonAncestorContainer))return;
 const pair=offsets(r);if(!pair)return;
 const [from,to]=pair;
 history.push(marks.map(m=>({...m})));if(history.length>30)history.shift();
 // Toggle: selecting a highlighted interval again removes it; partial overlap
 // removes the selected portion while retaining the rest.
 const intersects=marks.some(m=>m.from<to&&m.to>from);
 if(intersects){
  marks=marks.flatMap(m=>{
   if(m.to<=from||m.from>=to)return [m];
   const split=[];if(m.from<from)split.push({from:m.from,to:from});
   if(m.to>to)split.push({from:to,to:m.to});
   return split;
  });
 }else marks.push({from,to});
 marks.sort((a,b)=>a.from-b.from);
 save();sel.removeAllRanges();paint();
}

const EN_STUDY=[{"title":"Workshop safety and occupational health","summary":"Safe workshop practice includes accident prevention, appropriate personal protective equipment, first aid, fire protection and workplace hygiene. Identify hazards before starting and know how to act in an emergency.","points":[["Hazards and accident prevention","Before work, inspect tools and machines, secure the workpiece and keep the area tidy. Hazards include sharp edges, moving parts, flying chips, wood dust, noise, chemicals, slipping and material handling. Apply safety rules to the particular operation. (pp. 6, 10–11)"],["Personal protection and hygiene","Safety glasses protect against flying particles, hearing protection reduces noise exposure and suitable respiratory protection limits dust inhalation. Provide adequate lighting, ventilation and dust extraction. Loose clothing and unsuitable gloves must not approach rotating tools. (pp. 10–11)"],["First aid","Make the scene safe, check responsiveness and normal breathing, call 155 (or 112) and follow the dispatcher. If unconscious and not breathing normally, begin chest compressions and use an AED if available. Apply direct pressure for severe bleeding; avoid unnecessary movement of fractures. Some older instructions in the textbook are outdated. (pp. 7–8)"],["Integrated rescue system","The core Czech integrated rescue services are firefighters, emergency medical services and national police; firefighters generally coordinate joint operations. Call 150 for fire, 155 for ambulance, 158 for police, 156 for municipal police or 112 for the European emergency number. State who you are, what happened and where. (pp. 9–10)"],["Fire classes","A: solid materials (wood, paper); B: flammable liquids (varnish, petrol); C: gases; D: metals; F: cooking oils and fats. Choose the extinguisher according to its markings. Ordinary water or foam extinguishers are unsuitable for live electrical equipment; CO₂ may cause cold burns and forceful discharge can disturb combustible dust. (pp. 12–14)"],["Fire prevention","Remove accumulated wood dust, separate combustible materials from ignition sources and learn the escape routes and extinguisher locations. Fight only a small incipient fire if doing so is safe, and ensure that emergency services are alerted. (pp. 12–15)"]],"facts":[["Main hazards","Sharp tools, rotating machinery, chips, dust, noise, heavy loads, fire and electricity."],["PPE","Safety glasses, hearing protection, dust-rated respirator, appropriate footwear and clothing selected for the risk."],["Emergency numbers","150 fire; 155 ambulance; 158 national police; 156 municipal police; 112 European emergency number."],["Integrated rescue services","Firefighters, emergency medical services and national police, with other agencies supporting as necessary."],["Fire classes","A solids; B liquids; C gases; D metals; F cooking oils and fats. Match extinguishing agent to the marked class."],["First aid","Ensure safety, assess responsiveness and normal breathing, call 155, follow instructions and start CPR if not breathing normally."]],"red":["UPDATED INFORMATION: As of 2026, Government Regulation 495/2001 on personal protective equipment has been replaced by Regulation 390/2021; Decree 410/2005 on school hygiene by Decree 160/2024. Check current official rules.","UPDATED INFORMATION: For adults not breathing normally, current guidance recommends 100–120 chest compressions per minute, 5–6 cm deep, calling 155 and following the operator, and using an AED if available. Some older instructions in the textbook are outdated.","UPDATED INFORMATION: Do not automatically place an unconscious but normally breathing person on their back with raised legs. Monitor breathing and follow emergency service instructions; control major bleeding with direct pressure."]},{"title":"Machining","summary":"Machining changes a material's shape or dimensions by removing material with a tool. The removed material is called a chip; the operation is mechanical because the wood remains wood.","points":[["What changes during machining","A cutting tool removes material from a workpiece to alter its length, width, thickness or profile, or to create holes. The removed portion is called a chip or shaving. (p. 16)"],["Types of operation","Sawing separates pieces; milling creates surfaces and profiles; drilling makes holes; mortising creates recesses; turning makes rotational shapes; sanding removes fine surface particles. (p. 16)"],["Relation to technology","Machining is a mechanical process, not a change to the chemical composition of wood. Choose the process according to the required shape, surface quality and accuracy. (p. 16)"]],"facts":[["Definition","Progressive material removal by a cutting tool, called chip-forming machining."],["Operations","Sawing, milling, drilling, mortising, turning and sanding."],["Result","Changes to the workpiece's dimensions or shape, not its chemical composition."]]},{"title":"Manufacturing technology","summary":"Technology describes the method used to manufacture a product. A technological procedure defines the correct sequence of tasks and may combine hand and machine work.","points":[["Mechanical and chemical technologies","Mechanical processes change the shape or arrangement of wood, such as converting logs into lumber and manufacturing furniture. Chemical technologies are covered only to a limited extent in joinery; their products include adhesives, coatings, paper and PUR foams. (p. 16)"],["Technological procedure","A procedure sets out how to make a component, semi-finished item or complete product and which operations must precede others to avoid spoiling previous work. (p. 16)"],["Hand and machine production","A process may be manual, machine-based or a combination. One illustrative sequence is selecting and marking material → machining parts → making and assembling joints → surface finishing. This is an example, not a universal process plan. (p. 16)"]],"facts":[["Types","Mechanical: machining and shaping. Chemical: producing or modifying substances such as adhesives and finishes."],["Technological procedure","A logically ordered sequence of operations for manufacturing a part or product."],["Why sequence matters","Measuring, machining, assembly and finishing must be arranged appropriately."]]},{"title":"The joiner's workplace","summary":"A joiner's workshop needs adequate space, suitable environmental conditions and order. Its central bench is a woodworking workbench used to hold workpieces securely.","points":[["Workshop","The work area must satisfy spatial, thermal and hygiene requirements. Keeping the shop orderly and wearing appropriate working clothes and footwear directly improve safety and workmanship. (p. 18)"],["Workbench construction","A traditional woodworking bench has a robust top with a tool trough and an underframe. A front vice is usually on the left and an end vice on the right; steel screws operate the clamping mechanisms. (p. 18)"],["Bench dogs and protection","Adjustable bench dogs help secure longer pieces. Use a suitable backing board when drilling, mortising and gluing to avoid damaging the workbench surface. (p. 18)"]],"facts":[["Workbench","Top, underframe, tool trough, front and end vices, steel screws and bench dogs."],["Bench dogs","Height-adjustable stops used for holding longer workpieces."],["Protecting the bench","Use a backing board for drilling, mortising and glue-ups."],["Housekeeping","A basic element of safety, efficiency and health protection."]]},{"title":"Measuring and marking tools","summary":"Accurate measurement and marking precede machining. Length and thickness are checked with rules, tapes and callipers; angles with squares and bevel gauges; layout lines with a pencil and marking gauge.","points":[["Measuring versus marking","Measuring determines length, width, thickness or an angle using a measuring tool. Marking transfers a required measurement onto the workpiece using a pencil or awl; the line identifies where to cut. (p. 19)"],["Rules, tapes and precision","Folding rules are usually 1–2 m long; retractable tape measures contain a steel strip, and long tapes serve larger distances. For fine measurements the book warns against relying on a worn tape hook. One inch equals 25.4 mm; the book quotes 1 mm as normal furniture-making accuracy. (pp. 19–20)"],["Vernier calliper","The outer and inner jaws measure external and internal dimensions, and the depth rod measures holes. Read whole millimetres on the main scale and tenths at the aligned vernier graduation. The book illustrates 15.8 mm. Protect the jaws from drops and impacts. (pp. 21–23)"],["Checking angles","A try square checks 90° and can be tested by comparison with another accurate square. A fixed mitre square checks 45°, an adjustable bevel gauge transfers other angles and a protractor measures them. (pp. 23–24)"],["Level and plumb","A spirit level uses a bubble vial to check horizontal and often vertical surfaces. A plumb bob checks vertical alignment; laser measuring tools can replace some of these applications. (p. 25)"],["Marking wood","A sharp, relatively hard pencil produces a narrow line; a broad carpenter's pencil is less suitable for accurate joinery. A marking gauge scribes lines parallel to a reference edge, while dividers mark circles and arcs. (pp. 26–27)"]],"facts":[["Length-measuring tools","Folding rule, tape measure, long measuring tape, calliper, outside and inside callipers."],["Vernier calliper","Measures outside and inside dimensions and depth; main scale and vernier (0.1 mm in the textbook)."],["Squares","Try square 90°; fixed mitre square 45°; adjustable bevel gauge transfers other angles."],["Horizontal / vertical","Spirit level with vial, plumb bob or laser devices."],["Marking gauge","Scribes a line at a set distance parallel to a reference edge."],["Dividers","Mark circles, arcs and subdivisions."],["Key figures","1 inch = 25.4 mm; the textbook specifies ordinary furniture-making measurement to 1 mm."]]},{"title":"Sawing and hand saws","summary":"A saw removes wood using a toothed blade. Tooth size, tooth geometry, cutting direction and guidance determine cutting speed and quality. Maintenance and safe handling are essential.","points":[["Teeth and cut quality","Coarse teeth remove material faster but leave a rougher surface; fine teeth cut more slowly and cleanly. Tooth geometry is selected for cutting along or across the wood grain. (p. 28)"],["Frame saws","A coarse rip/crosscut frame saw is often over 700 mm long. A fine tenon-type frame saw is about 600–700 mm long for accurate tenons and dovetails. A narrow-bladed turning saw, up to about 10 mm wide, cuts curves. Check blade tension and twist before work. (pp. 28–29)"],["Backless and specialist hand saws","A tenon saw has a short, wide, fine-toothed blade; a panel saw is for larger pieces; a keyhole saw cuts internal openings; a grooving saw cuts sliding-dovetail grooves; a fret saw cuts delicate shapes; a veneer saw cuts veneer against a straightedge. Traditional Japanese saws generally cut on the pull stroke. (pp. 30–32)"],["Correct sawing technique","A conventional frame saw usually cuts on the forward stroke. Start with short, light strokes; once the kerf forms, use the blade's full length without excessive pressure. Slow down at the exit to avoid splintering. The textbook cautions about keeping the guiding thumb clear. (p. 33)"],["Maintenance and terminology","The tooth line joins the tooth tips, which should have equal height. The face is the cutting-facing surface, the back is behind it, and pitch is the distance between tips. Setting teeth alternately creates a kerf wider than the blade to prevent binding. Hardened modern teeth may not be sharpenable with ordinary files. (pp. 35–36)"]],"facts":[["Categories","Frame saws and handle-mounted hand saws."],["Frame saws","Coarse saw for rough cuts; fine frame saw for tenons; turning saw for curves."],["Other saws","Tenon, panel, keyhole, grooving, fret and veneer saws."],["Japanese saws","Usually cut when pulled and typically use a thin blade."],["Tooth line","The alignment of tooth tips; uniform height matters."],["Tooth set","Alternately bent teeth make a wider kerf and reduce binding."],["Safety","Secure the workpiece, keep blade straight, avoid forcing the cut and finish carefully."]]},{"title":"Planing and hand planes","summary":"Planing removes long shavings to create flat or profiled wood surfaces. Different planes serve different tasks and require a sharp, accurately adjusted iron.","points":[["Principle and components","A wooden plane has a body, sole, blade bed, mouth for shavings, wedge and handles. The iron has a face, back, cutting edge and bevel. (pp. 37–38)"],["Adjusting the iron","How far the cutting edge projects below the sole controls shaving thickness. A cap iron, screwed to the blade, bends shavings close to the cutting edge and reduces tear-out. The textbook gives about 1 mm between cap iron and edge and an edge angle of around 25°. (p. 38)"],["Four main plane types","The scrub plane (about 250 × 33 mm) has a rounded iron for rapid rough removal. The smoothing plane (about 250 × 48 mm) levels a surface, including end grain. The cap-iron plane (about 250 × 48 mm) produces a cleaner surface. The narrow rebate plane (about 20–40 mm wide) works grooves and profiles. (pp. 39–40)"],["Special planes","A jointer plane is longer for flattening large work; a toothing plane roughens surfaces; a fine finishing plane produces the final surface; special grooving and curved-body planes make shaped parts. Metal planes and Japanese pull planes are also available. (p. 41)"],["Planing sequence","Clamp the workpiece; the textbook recommends orienting its bark-facing side toward the workbench. Select and set the plane, work with the grain and check flatness with one straightedge or two matching winding sticks. Set thickness and width with a marking gauge referenced to an already true face. (p. 42)"],["Grinding and honing","Grind a bevel (the book illustrates 25–30°) and remove the burr by honing on an appropriate stone, using suitable lubricant. Start coarser and finish finer. High-speed grinding may overheat and soften the blade; use light pressure, cooling and eye protection. (pp. 43–44)"],["Cabinet scraper and storage","A cabinet scraper is a thin steel plate for delicate finishing, curved areas and veneered surfaces. Unlike a plane iron it cuts with a deliberately raised burr. Never set a plane down directly on its projecting blade or damage may occur. (pp. 41, 47–48)"]],"facts":[["Plane parts","Body, sole, bed, mouth, iron, wedge, handle and adjustment elements."],["Plane iron","Face, back, cutting edge and bevel; commonly about 25–30° sharpening bevel depending on tool."],["Cap iron","Breaks shavings near the cutting edge to reduce tear-out."],["Main types","Scrub: heavy removal; smoothing: levelling; cap-iron: clean finish; rebate: grooves and profiles."],["Other types","Jointer, fine finishing and toothing planes, grooving and shaped planes."],["Procedure","Secure the workpiece, check grain and iron setting, plane with the grain, verify flatness."],["Sharpening","Grind bevel, hone away burr, use suitable stone lubricant and maintain stone flatness."],["Cabinet scraper","Steel scraper with a raised working burr for delicate surface finishing."]]},{"title":"Mortising and chisels","summary":"Chiselling removes wood chips to produce mortises, grooves and shaped recesses. Select chisel width and shape for the joint; maintain a sharp edge and work safely.","points":[["Purpose of mortising","Use chisels to remove chips and make mortises, grooves, dovetail sockets or curved recesses. Secure the workpiece and match chisel width to the intended joint. (pp. 49–50)"],["Bench chisel and its parts","A flat bench chisel is the most common type. The book lists widths 6, 8, 10, 12, 14 mm and beyond. Its parts are blade, bevel, neck, shoulder and handle; a metal ferrule protects the handle from mallet blows. (p. 49)"],["Gouges and mortise chisels","Curved gouges carve rounded shapes and recesses, about 1–60 mm wide in the textbook. Mortise chisels have a much thicker blade for deep mortises and are listed in approximately 4–14 mm widths. (pp. 50–51)"],["Maintenance and safety","Sharpen and hone chisels much like plane irons, avoiding heat that would soften steel. Strike with a wooden joiner's mallet; never direct the cutting edge toward your hand or body and put chisels down with the edge facing away. (pp. 51–52)"]],"facts":[["Bench chisels","General work on mortises, grooves and sockets; various blade widths."],["Mortise chisels","Thick, rigid blade for narrow/deep mortises."],["Gouges","Curved shapes and hardware recesses; carving."],["Parts","Bevel, blade, neck, shoulder and handle."],["Mallet","Usually beechwood; protects the handle from damage."],["Safety","Never chisel toward your hand or body; store edges facing away."]]},{"title":"Drilling and drilling tools","summary":"Drilling forms cylindrical holes with a rotating cutting tool. Drill types vary in guidance, grain cutting, chip removal and possible hole size.","points":[["Drill construction","A centre point locates the hole, spurs sever fibres cleanly around the edge and spiral flutes remove chips from the hole. (pp. 53–55)"],["Manual tools","An awl marks a hole location or starts a small screw hole. A gimlet drills by hand. Traditional spoon or centre bits have a threaded tip, cutting spurs and a broad cutter and were used with a brace; adjustable forms also exist. (pp. 53–54)"],["Auger and spade bits","An auger bit has a spiral for clearing chips and works in hard and end-grain wood; the textbook lists sizes from roughly 8 mm. A flat spade bit is a simple tool for larger holes and can be used in an electric drill. (pp. 54–55)"],["Brad-point and Forstner bits","A woodworking twist bit has a centre point and spurs unlike a standard metalworking drill, providing straighter, cleaner holes. A Forstner bit uses rim cutters and broad cutting lips for large accurate flat-bottomed holes; securely clamp the work and preferably use a drill press because of torque. (pp. 55–56)"],["Countersinks, care and hazards","A countersink makes a recess for a screw head. Protect the cutting edges and do not use wood bits to drill metal. A large bit that jams can violently rotate an unsecured workpiece. (pp. 56–57)"]],"facts":[["Tools","Awl, gimlet, centre bit, auger bit, spade bit, brad-point bit, Forstner bit and countersink."],["Centre point","Guides the drill and reduces wandering along the grain."],["Spurs","Score the hole perimeter to prevent torn fibres."],["Auger bit","Deep holes with efficient chip removal through a spiral."],["Forstner bit","Wide, accurate flat-bottom holes, often for furniture fittings."],["Countersink","Recess for a countersunk screw head."],["Safety","Clamp the workpiece firmly; a jammed bit can spin it."]]},{"title":"Filing and rasping","summary":"Files and rasps shape edges, curves and transitions. Their main differences are tooth form, coarseness and removal rate.","points":[["Construction","Files and rasps have a hard toothed body and a pointed tang held in a handle. Tool length excludes the tang; tools differ in length, section and tooth pattern. (p. 58)"],["Files","Files have finer teeth and different sections: flat, half-round, round or triangular. Single-cut teeth are parallel, double-cut teeth cross. Joinery often uses a half-round single-cut file; needle files serve delicate work. (pp. 58–59)"],["Rasps","Rasps have prominent individual teeth for faster wood removal but can tear fibres. The book highlights the half-round rasp. Coarseness depends on tooth size and spacing. (p. 59)"],["Handling","Always clamp the work, use a handle and guide the tool with both hands, moving slightly sideways on curves. Files are hardened and brittle: never use them as levers. Clean clogged teeth with a suitable brush and avoid impacts against other tools. (pp. 59–60)"]],"facts":[["File","Fine cut in several sections, selected for wood, metal or plastic."],["Rasp","Coarse individual teeth, higher wood removal rate, may tear grain."],["Tooth patterns","Single and double cut; teeth may be cut or milled."],["Use","Secure the workpiece, use a handle, guide evenly without excessive pressure."],["Maintenance","Brush out clogged teeth; protect brittle tools from impacts and never lever with them."]]},{"title":"Sanding and abrasives","summary":"Sanding removes small irregularities and prepares wood for finishing. Selecting the right abrasive and progressing from coarse to fine grit determine surface quality.","points":[["Purpose of sanding","Sanding removes small particles and machining marks, leaving a smooth surface ready for finishing. It generally follows sawing, milling or planing. (p. 62)"],["Abrasive grains","Natural abrasives include quartz and garnet; manufactured grains are more common. Aluminium oxide (corundum) is used on wood, while silicon carbide also suits veneer and varnished surfaces. (p. 62)"],["Understanding grit grades","Lower numbers mean coarser abrasives. The textbook gives P60–90 for rough work, P100–180 for finer sanding and P220–400 for varnish and filler; this is a guide, not a universal specification. (p. 62)"],["Hand-sanding procedure","Begin with a suitable coarse grade and progress to finer grades. Make final strokes with the grain. On flat surfaces use a sanding block with a compliant backing; sanding sponges suit curves. The textbook also describes lightly wetting the wood, allowing it to dry and sanding the raised fibres. (pp. 63–64)"],["Backing materials and selection","Abrasive grains are bonded to paper or cloth. Belts, mesh and abrasive wool also exist. Progress through a sensible sequence of grades to remove marks left by previous grit. (pp. 62–64)"]],"facts":[["Grain materials","Natural: quartz and garnet. Synthetic: aluminium oxide and silicon carbide."],["Backing","Paper, cloth, belts; sponges, wool and mesh for special surfaces."],["Grit size","Lower number = coarser. Examples: 60–90 coarse, 100–180 fine, 220–400 varnish and filler."],["Hand sanding","Begin coarser, progress finer, finish with the grain and use a sanding block."],["Raised grain","Wet, dry and lightly resand before finishing when appropriate."]],"red":["UPDATED INFORMATION: Modern coated abrasives generally use FEPA/ISO P-grit designations. A P-number is not simply the number of sieve openings per square inch as the older textbook explanation suggests. Follow the abrasive manufacturer's specification."]},{"title":"Mechanical fasteners and fittings","summary":"Woodworking joints may use metal, wood or plastic fasteners. Important criteria are strength, the ability to dismantle the joint, accurate pilot holes and suitability for the materials.","points":[["Dismantling and materials","Fasteners include metal nails, staples, screws and bolts, wooden dowels and tongues, and plastic brackets. Some joints can be repeatedly dismantled, whereas others are damaged when taken apart. A mechanical joint is not necessarily a reusable knock-down joint. (pp. 66–67)"],["Nails and staples","A nail has a head, shank and point; nails often secure cabinet backs or small strips. The textbook recommends a nail length at least 2.5 times the attached material's thickness and slightly blunting a point near an edge to reduce splitting. Staples can substitute for nails and are common in upholstery. (pp. 67–68)"],["Wood screws","A wood screw consists of head, shank and thread. Heads may be countersunk, raised countersunk or round. The book suggests pilot holes to about three-quarters of the length of larger screws; choose drill diameter for the screw core and wood species rather than applying a universal rule. Use a matching driver bit. (pp. 68–69)"],["Knock-down connectors and tools","A bolt with a threaded barrel nut or an eccentric cabinet connector allows assembly and disassembly. Hammers, pliers and screwdrivers are used. PH uses a basic cross recess, whereas PZ has additional small recesses and requires a matching bit. (pp. 70–72)"],["Dowels, tongues and biscuits","Fluted beech dowels are commonly 6, 8, 10, 12 or 16 mm in the book; flutes distribute glue. A tongue fits into matching grooves. Biscuit joinery uses oval inserts in slots cut by a biscuit joiner, improving alignment and glued contact area. (pp. 73–74)"],["Plastic connectors","Plastic corner brackets with covers and trapezoidal connectors perform specific assembly tasks, such as securing a tabletop to its apron. (p. 75)"]],"facts":[["Metal fasteners","Nails, staples, wood screws, bolts and fittings."],["Nails","Head, shank and point; textbook guideline length at least 2.5× attached thickness."],["Wood screws","Countersunk, raised countersunk or round head, shank and thread; predrill appropriately."],["PH versus PZ","Different cross-head recesses and bits; correct matching avoids damage."],["Knock-down hardware","Barrel nuts with bolts and eccentric cam connectors."],["Wooden elements","Fluted dowels, loose tongues and biscuits."],["Biscuits","Flat inserts in routed slots for alignment and increased bonded area."],["Plastic elements","Corner brackets, dowels and trapezoidal connectors."]],"red":["UPDATED INFORMATION: The textbook's 'drill to shank diameter' and 'three-quarters of screw length' rules are not universally valid. Pilot-hole diameter and depth depend on the screw core, timber species, distance from an edge and manufacturer instructions."]},{"title":"Glued joints","summary":"Adhesive joints are permanent. Glue may join two surfaces directly or reinforce tenons, mortises, dowels, fingers and tongues. Joint quality depends on contact surfaces, appropriate adhesive, pressure and curing.","points":[["Purpose of a glued joint","Adhesive joints are normally non-dismantlable. A butt joint may rely on glue alone; a mortise-and-tenon, finger joint, dowel, biscuit or tongue-and-groove joint often gains strength from glue. Accurate mating surfaces matter. (p. 77)"],["Adhesive types","The textbook lists PVAc dispersion adhesives, urea-formaldehyde (UF) and traditional animal glues. Choose an adhesive based on moisture exposure, material and the manufacturer's technical data. (p. 77)"],["Applying and clamping","Spread adhesive with a brush, applicator or sprayer. Clamp the parts until the bond has cured sufficiently; releasing pressure too soon can weaken or damage the joint. (p. 77)"],["Clamps and jigs","A clamp generally includes a bar, fixed jaw, sliding jaw and pressure screw. Various sizes and special corner or frame jigs maintain alignment and force during bonding. (pp. 77–79)"]],"facts":[["Adhesives","PVAc dispersion, UF and traditional animal-based glues listed by the textbook."],["Clamps","Fixed and moving jaws apply pressure throughout the required setting period."],["Principles","Accurate fit, appropriate glue spread, uniform clamping force and sufficient curing."],["Important conditions","Follow the adhesive data sheet for open time, minimum temperature and wood moisture."]]},{"title":"Wide and lengthwise wood joints","summary":"Edge and end joints increase the width or length of solid-wood components. Accurate preparation, correct grain arrangement, suitable glue and clamping help keep panels flat and stable.","points":[["Widening and lengthening","Edge joints put boards side by side to make a wider panel. Length joints join their ends to produce longer pieces, such as continuous strips or finger-jointed stock. (pp. 80–82)"],["Edge-glued panel","A solid-wood panel is made from narrower boards glued together edge to edge. Match moisture content, prepare the edges accurately and arrange the boards to reduce warping. (pp. 80–81)"],["Board arrangement","The book illustrates arranging heartwood and sapwood sides, marking board order and choosing pieces for consistent appearance and dimensional stability. Check for clean and straight mating edges before gluing. (p. 81)"],["Gluing sequence","Select and mark boards, machine to size, apply glue along the joining edges, clamp the panel while checking flatness, then allow curing and dress the surface. (pp. 80–81)"],["Length joints","End joining differs from edge gluing. Finger joints or other end joints extend stock and permit use of shorter pieces of wood. (p. 82)"]],"facts":[["Edge joints","Butt edges, tongue-and-groove, loose tongues and similar widening connections."],["Edge-glued panel","Flat panel assembled from glued solid-wood strips."],["Board selection","Appropriate ring orientation, equal moisture and freedom from major defects."],["Gluing","Straight edges, glue spread, clamping, flatness checks and curing."],["Length joints","Joining the ends of components, often using finger joints or laps."]]},{"title":"Frames and structural joints","summary":"Frame and corner joints transfer loads between wooden members. Choose them for loading, stock thickness, appearance and accurate mating surfaces.","points":[["Frame construction","Frame joints join members at corners or intermediate points. The loading, wood thickness, appearance and precision of fit determine the chosen joint. (pp. 84–85)"],["Tenon and open bridle joint","A common frame corner joint has a tenon on one part and an open-ended slot on the other. Mark and scribe parts accurately before cutting; typical hand tools include a square, marking gauge, saw and chisel. (pp. 85–87)"],["Mortise-and-tenon joint","A tenon fits a closed recess, or mortise, made with a mortise or bench chisel. The fit should be snug but not split the wood. The book also describes reinforced tongue-and-mortise variants for highly loaded furniture, including chairs and tables. (pp. 87–91)"],["Dowels and half-lap joints","Dowel joints require accurately aligned drilled holes. A half-lap joint removes part of each member's thickness to produce a flush overlap, at a corner or an intersection. (pp. 91–93)"],["Multiple tenons and tongues","Multiple tenons distribute load across a wider joint and may be through-tenons secured by wedges. Loose or integral tongues join panels and corners according to their design. (pp. 94–97, 107)"],["Finger and dovetail joints","Through dovetails show at both faces. Half-blind dovetails are hidden at one visible face, often a drawer front; secret dovetails are hidden at both. Sloping dovetail sides mechanically resist withdrawal. Precise layout and careful chiselling are essential. (pp. 98–104)"],["Sliding dovetail","A sliding dovetail consists of a matching trapezoidal groove and tongue. It helps guide or restrain a wide panel; the textbook shows a groove depth of roughly one-third panel thickness and an angle of approximately 20°. Allow for natural wood movement where required. (pp. 104–106)"],["Checking precision","Select and mark parts → lay out → saw tenons and cut mortises or slots → test-fit dry → correct mating faces → glue, clamp and check squareness. Files and rasps are not suitable for producing accurate flat tenon shoulders. (pp. 86–87, 99–100)"]],"facts":[["Frame joints","Bridle joint, mortise-and-tenon, reinforced tenon variants, dowelled joints and lap joints."],["Mortise and tenon","A projecting tenon enters a mating mortise; fit and bonding govern strength."],["Half-lap","Part of both member thicknesses is removed to make an overlap."],["Dovetails","Through, half-blind and secret joints; strong drawer and cabinet corners."],["Dovetail shape","Wedge-like sides resist pulling the joint apart."],["Sliding dovetail","Matching trapezoidal groove and tongue that helps stabilize a wide joint."],["Preparation","Measure, lay out, machine, dry-fit, adjust, glue and check right angles."]]},{"title":"Preparing wood for manufacture","summary":"Before manufacture, timber is conditioned to the required moisture content and sometimes softened temporarily to improve its workability. It must also be protected from water and biological deterioration.","points":[["Purpose of preparation","Wood needs the right moisture level for manufacture and sometimes temporary softening to allow forming or veneer cutting. Protection from water and biological attack is also important. (p. 110)"],["Plasticization","Steaming or boiling applies heat and moisture to soften wood for bending, peeling or slicing. It changes the mechanical behaviour of lignin in cell walls; the behaviour changes again as the wood cools and dries. (p. 110)"],["Why timber is dried","Fresh timber contains water. Drying changes its dimensions and may cause checking, warping or distortion. Free water and bound water are distinguished; the aim is an appropriate moisture level for the intended environment. (p. 111)"],["Air drying","Stack sawn timber with correctly spaced stickers on raised supports and protect it from direct rain. Air circulation dries the individual pieces, while suitable sticker placement reduces deformation. (pp. 111–115)"],["Measuring moisture","The gravimetric method compares mass before drying with oven-dry mass: moisture content = (wet mass − dry mass) / dry mass × 100%. Electrical resistance meters give rapid practical estimates. (pp. 113–114)"],["Kiln drying","Kilns control temperature, relative humidity and air movement. The schedule must suit the wood species, dimensions and starting moisture, or defects and inadequate drying may result. Store timber appropriately afterwards. (pp. 115–118)"],["Design-based wood protection","Prevent prolonged wetting: keep timber off the ground, provide overhangs, drainage and ventilation, and avoid trapping moisture behind cladding. The textbook illustrates keeping exterior cladding approximately 300 mm above ground level. (pp. 118–120)"],["Chemical protection and safety","Preservatives target particular biological agents and must be selected for the exposure class and applied according to the product instructions. Dusty woodworking premises also require fire precautions: dust and chips can burn or explode. (pp. 118–121)"]],"facts":[["Plasticization","Temporary increase in wood flexibility through heat and moisture, e.g. steam or boiling."],["Moisture","Free and bound water affect dimensions and mechanical properties."],["Air drying","Ventilated stickered stacks protected from rain."],["Kiln drying","Controlled temperature, humidity and air flow according to a drying schedule."],["Measurement","Gravimetric oven-drying method and electrical moisture meters."],["Protection","Design measures against moisture and chemical treatment selected for exposure."],["Hazards","Fungi, mould, insects, fire and moisture; ventilation and good storage matter."]]},{"title":"Sawmill production","summary":"Sawmills cut logs into boards, planks, beams, battens and strips. Sawn timber is classified by section size, thickness, width and the condition of its edges.","points":[["Converting logs into lumber","Longitudinal sawing turns logs into boards, thick planks, beams, smaller squared timbers, battens and strips. The terminology depends on cross-section, thickness, width and edge treatment. (pp. 122–124)"],["Unedged and edged timber","Unedged boards retain some curved outer surface of the log. Edged timber has its sides cut square. The textbook distinguishes boards from thick planks mainly by thickness, and beams from smaller squared timber by cross-section. (pp. 122–123)"],["Cross-section categories","According to the textbook, squared timber has width less than twice its thickness; smaller squared timber is no more than 100 mm thick, while larger beams exceed 100 mm. Battens have a cross-sectional area roughly 10–25 cm² and small strips up to 10 cm². These are textbook classifications. (pp. 123–124)"],["Sawing methods","Gang sawing uses several blades at once, for example a frame saw. Individual cutting uses band or circular saws. Sawing patterns affect lumber sizes and how much usable wood is recovered from a log. (pp. 125–126)"],["After sawing","Sort sawn wood, stack on spacers, dry it and store it to minimise defects and quality loss. (pp. 122–127)"]],"facts":[["Log / sawlog","Raw material for processing in a sawmill."],["Unedged sawn timber","Boards and planks with remaining rounded log edges."],["Edged sawn timber","Beams, squared stock and other pieces with squared edges."],["Small sections","Battens and thin strips distinguished by cross-section and use."],["Sawing","Gang sawing with multiple blades, or individual cuts using e.g. band saws."],["Sorting and storage","Classification by dimension and quality, appropriate stacking and protection."]]},{"title":"Veneer and plywood manufacture","summary":"Veneer is a thin sheet of wood cut from a log. It is used for decorative faces, plywood and other laminated products; the wood figure depends on the direction of cutting.","points":[["What veneer is","A veneer is a thin wood sheet separated from a log, used for visible surfaces or as a layer in plywood. Grain figure depends on the orientation of cutting relative to growth rings. (pp. 128–129)"],["Three manufacturing methods","Saw-cut veneer is produced with a saw, sliced veneer with a knife from a prepared log section, and rotary-cut veneer by peeling a turning log. These methods differ in material recovery and grain pattern. (pp. 128–129)"],["Log plasticization","Heat and moisture soften the wood before slicing or peeling to reduce cutting resistance and cracks. The effect on lignin in the cell walls is important. (pp. 128–129)"],["Drying and matching veneers","Peeled or sliced veneer has increased moisture after preparation and must be dried and graded. Decorative leaves are matched by grain pattern and required panel size. (pp. 129–130)"],["Plywood","Veneer layers are coated with adhesive, stacked usually with adjacent grain directions crossing, then pressed together. Cross-graining improves dimensional stability compared with solid wood; properties depend on species, bonding and ply count. (pp. 130–131)"]],"facts":[["Veneer processes","Sawing, slicing and rotary peeling, often preceded by softening the log."],["Grain figure","Depends on how the veneer is cut relative to growth rings."],["Veneer preparation","Drying, grading, matching to panels and bonding."],["Plywood","Multiple glued veneer plies pressed together; alternating grain directions reduce movement."],["Types","Classified by species, number of plies, construction and intended use."]]},{"title":"Blockboard manufacture","summary":"Blockboard has a core made from wooden strips, faced with veneer on both sides. The face layers and core arrangement determine its properties.","points":[["Blockboard construction","This panel has a core assembled from wooden laths, with veneers glued to both faces. The construction and arrangement of its core influence performance. (p. 132)"],["Unglued core","The textbook describes string-linked cores: individual strips are temporarily held side by side during production without edge-gluing each strip to its neighbour. (p. 132)"],["Glued core","The strips are edge-glued. They are made from prepared wood laths or other wood elements; manufacture must ensure even thickness and stability. (p. 133)"],["Manufacturing sequence","Make the strip core, apply adhesive and veneer layers to both sides, press the complete panel, then trim and finish it. (pp. 132–133)"]],"facts":[["Construction","Solid-wood strip core plus veneer layers on both sides."],["Core types","Strips joined by gluing or held together by another production method."],["Core material","Solid wood strips or other suitable arrangements according to the product."],["Applications","Furniture and interior panels where blockboard properties are appropriate."]]},{"title":"Wood-based particle and fibre panels","summary":"Engineered wood panels are made from chips, strands, fibres or sawdust combined with binders and pressed into sheets. Particle size, orientation, density and adhesive determine their behaviour.","points":[["Principle","Wood chips, strands, fibres or sawdust are mixed with a suitable binder and pressed into flat panels. Particle size, alignment, density and binder type control properties. (p. 134)"],["Particleboard (DTD)","Particleboard is pressed from wood particles and adhesive and can have finer particles on the faces and coarser particles in the core. It is widely used for furniture and as a substrate for surface finishes. The book also covers extrusion-pressed forms. (pp. 134–135)"],["OSB","Oriented strand board uses long slender wood strands aligned in layers, with the outer layers predominantly along the board length. The application depends on board grade, service conditions and direction of loading. (p. 136)"],["MFP","Multi-function panels are made from longer particles or strands but with an arrangement different from the strongly oriented layers of OSB. (p. 137)"],["Fibreboard","Wood is broken down into fibres. Different manufacturing methods and densities produce soft insulating panels, medium-density fibreboard (MDF) and harder high-density panels (HDF). MDF is formed from fibres mixed with binder and hot-pressed. (pp. 138–141)"],["Other boards and selection","The textbook also describes sawdust panels and cement-bonded particleboards. Select a product by loading, moisture exposure, machinability, appearance and finish. A general material group name does not establish suitability for damp conditions or structural loads. (pp. 142–143)"]],"facts":[["Particleboard / DTD","Wood particles bonded with adhesive and pressed into boards."],["OSB","Oriented strand board with aligned long strands, often for construction."],["MFP","Multipurpose panels of longer particles with a different strand arrangement."],["Fibreboard / MDF / HDF","Wood-fibre panels; MDF has medium density and HDF high density."],["Other types","Sawdust panels, cement-bonded boards and other composites."],["Selection criteria","Exposure, structural loads, machinability, surface finish and adhesive emissions."]],"red":["UPDATED INFORMATION: For wood-based boards, check the current product datasheet and classification for structural or damp environments. Historical nomenclature alone is not enough for specifying construction applications."]}];
const EN_QUESTIONS=[[["How do you provide first aid after an injury?","Ensure the scene is safe; check responsiveness and breathing, call 155 and follow the dispatcher. If the person is not breathing normally, start CPR. Apply direct pressure to serious bleeding."],["What is the integrated rescue system?","A coordinated system connecting firefighters, emergency medical services, national police and other responders during emergencies."],["List the emergency telephone numbers.","150 firefighters; 155 ambulance; 158 national police; 156 municipal police; 112 European emergency number."],["What must a water extinguisher not be used on?","In particular, live electrical equipment, burning flammable liquids or burning metals. Match the extinguishing agent to the fire class."]],[["How do you check whether a try square is accurate?","Compare it with another accurate square or flip it against the same reference line and check whether the lines coincide."],["What is a marking gauge used for?","Scribing a line parallel to an edge at a selected offset."],["Set the vernier calliper to 20.5, 30.7 and 27.4 mm.","Set the main scale to the whole millimetres and use the vernier for the tenths; demonstrate each measurement."],["What measuring accuracy is used in furniture making?","The textbook specifies 1 mm for ordinary work; finer measuring is used for precise joints and fittings."]],[["Name the types of frame saw.","Coarse cutting saw, fine tenon saw and narrow turning saw."],["What is a panel saw used for?","Hand cutting comparatively large wood parts, mainly straight cuts."],["Which saw is used for tenons and dovetails?","A fine-toothed tenon saw or fine frame saw."],["What are the rules for sharpening saw teeth?","Clamp the blade, file tooth faces evenly with a triangular file and maintain equal tip height, appropriate tooth profile and set."],["What is the tooth line?","The line through the tips of saw teeth; the tips should be level."],["Which part of the saw tooth is the back?","The sloping surface behind the tooth face."],["How do accidents happen with hand saws?","The blade may jump out of the cut; poor clamping, cutting toward a hand or unsafe storage may cause injury."]],[["Describe the parts of a hand plane.","Body, sole, blade bed, mouth, iron, wedge, handles and, on some planes, a cap iron."],["Identify face, back, edge and bevel on a plane iron.","The face and back are the two main sides; the cutting edge is their intersection and the bevel is the sloped ground surface."],["Why do you lubricate a honing stone?","To carry away swarf, reduce clogging and assist smooth honing. Use the lubricant suitable for the stone."],["Describe and demonstrate honing a plane iron.","Hold a constant bevel angle on a flat suitable stone, hone evenly, remove the burr from the back and finish on a finer surface."],["What may happen to a blade on a high-speed grinding wheel?","Overheating can draw the temper and soften or damage the cutting edge."],["Which PPE is used at an electric grinding wheel?","Safety glasses or appropriate face protection."]],[["Which face of the wood is oriented toward the bench at the start of planing?","The textbook recommends the left, bark-facing side toward the workbench top."],["Name the main types of hand planes.","Scrub, smoothing, cap-iron and rebate planes; others include jointer, finishing and toothing planes."],["What is a scrub plane used for?","Rapid rough removal of material and initial levelling of uneven surfaces."],["What is a cap iron and why is it used?","A plate fitted to the plane iron that breaks shavings near the edge and reduces grain tear-out."],["Should planes be set down on their soles?","No, not if the blade would touch the surface and be damaged. Set the plane down safely on its side or protect the edge."]],[["Name the types of chisels.","Bench chisels, mortise chisels and curved gouges."],["How are chisels sharpened?","Grind the correct bevel without overheating, then hone away the burr while keeping the blade corners sharp."],["What are the safety rules for using chisels?","Secure the work, never point the blade toward the hand or body, use a suitable mallet and store the blade facing away."]],[["Name at least four types of wood drill bits.","Centre bit, auger bit, spade bit, brad-point twist bit and Forstner bit."],["Is a metalworking drill suitable for wood, and why?","It can be used, but is less suitable because it normally lacks a centre point and spurs, so it may wander and tear fibres."],["What accidents can happen when drilling?","A jammed bit can spin an unsecured workpiece; rotating tools and flying chips can also cause injuries."]],[["Can a file or rasp be used as a lever? Why?","No. Hardened steel is brittle and may snap under bending loads."],["How do you clean a clogged file or rasp?","Use a suitable wire brush; remove resin with an appropriate cleaning agent in accordance with safety instructions."]],[["Why is wood sanded?","To remove small irregularities, even out the surface and prepare it for finishing."],["Which abrasives are used on wood?","Abrasive paper, cloth, sponges, mesh and, for some purposes, abrasive wool."],["What grit sizes are used for coarse sanding, fine sanding and sanding coatings?","The textbook suggests P60–90 for coarse, P100–180 for fine and P220–400 for varnish and filler; select the grade for the finish system."]],[["Is a nailed joint dismantlable?","The textbook groups nails with mechanical joints, but removing them may damage the components; it is not normally a repeatedly reusable connection."],["Where is a bolt-and-barrel-nut connection used? Is it permanent?","For cabinets and seasonal garden furniture; it is a strong but dismantlable joint."],["What shape does a commonly used screw head have?","Often a countersunk head with a cross recess; raised countersunk and round heads are also used."],["How deep should wood screws be predrilled and which drill diameter should be used?","The book suggests around three-quarters of screw length for larger screws; modern practice selects pilot diameter according to the screw core, timber and manufacturer."],["Why is a wooden dowel fluted?","The flutes help distribute adhesive and provide space for glue in the joint."],["What are the advantages and disadvantages of biscuit joints?","Easy alignment and increased glued area; however, a biscuit joiner is required and biscuits cost more than dowels."]],[["What is an edge-glued solid-wood panel?","A flat board assembled by gluing narrower solid-wood strips along their edges."],["What are the basic rules for making such a panel?","Use suitably dried stock, orient the rings, prepare clean straight edges, glue evenly, clamp and check flatness."]],[["Name the types of corner frame joints.","Bridle, mortise-and-tenon, reinforced tenon, lap, dowelled and dovetail joints."],["Where are mortise-and-tenon joints used?","In frames, doors, chairs, tables and other load-bearing joinery."],["Why are mortise widths of 7 or 13 mm problematic?","They may not correspond to standard chisel widths; choose a design and tooling that can create an accurate mortise."],["Name types of dovetail joints and their uses.","Through, half-blind and secret dovetails, especially for drawer and cabinet corners."],["What are dovetails?","Wedge-shaped interlocking tails and pins whose sloping sides resist pulling the joint apart."]],[["What is wood plasticization?","Temporarily softening wood with heat and moisture to facilitate bending and veneer production."],["Name plasticization methods.","Steaming and boiling, using moist heat."],["Describe natural drying of lumber and where it takes place.","Timber is stacked with stickers in a ventilated, sheltered yard and dries in ambient air."],["Describe artificial drying of lumber and where it takes place.","Kiln dryers control temperature, humidity and airflow according to a drying schedule."],["What fire risks arise in woodworking plants?","Fire and combustible-dust explosions involving fine dust, sawdust and wood waste."],["From which harmful influences must wood be protected?","Excess moisture, fungi, mould, insects, weather exposure and fire."],["What types of wood protection are used?","Design-based protection keeps wood dry and ventilated; chemical protection uses suitable preservatives for the exposure conditions."],["List three design-based measures for protecting wood.","Provide drainage and ventilation, keep wood above ground and use protective overhangs and suitable detailing."]],[["List the main sawn-timber products.","Boards, thick planks, beams, small squared timbers, battens and strips; edged and unedged timber."]],[["What is log plasticization and which constituent is affected?","Heat and moisture soften logs before peeling and slicing veneer; lignin in the cell walls is particularly important."],["Name methods of veneer production.","Sawing, slicing and rotary peeling."],["Briefly describe plywood manufacture.","Prepare and dry veneers, apply glue, arrange layers usually with crossed grain directions, hot-press and finish."]],[["What is blockboard made of?","A wooden strip core faced with veneer on both sides."],["Which types of blockboard cores are distinguished?","Unglued and edge-glued strip cores."],["What materials are used in blockboard with glued cores?","Mainly prepared solid-wood laths or other suitable wood elements depending on the design."]],[["What are engineered particle and fibre panels?","Boards made from wood chips, strands or fibres bonded and pressed into sheets."],["What is OSB?","Oriented strand board, made of layers of long, aligned wood strands bonded under pressure."],["How is MDF manufactured?","Wood is broken down into fibres, mixed with binder, formed into a mat and hot-pressed to medium-density fibreboard."]]];
engSections=EN_STUDY;engQuestions=EN_QUESTIONS;


/* Switch the text in the existing reader, never its layout or DOM tree. */
function switchLanguage(next){
 if(next===language)return;
 try{localStorage.setItem(storage,JSON.stringify(marks))}catch(e){}
 language=next;
 storage=language==='en'?'truhlar1.highlights.v2.en':'truhlar1.highlights.v2';
 try{
  const loaded=JSON.parse(localStorage.getItem(storage)||'[]');
  marks=Array.isArray(loaded)?loaded:[];
  localStorage.setItem('truhlar1.language.v2',language);
 }catch(e){marks=[]}
 history=[];
 selectedInterval=null;
 applyLanguage();
}
langBtn.onclick=()=>switchLanguage(language==='cs'?'en':'cs');
frame.addEventListener('load',()=>applyLanguage());
try{language=localStorage.getItem('truhlar1.language.v2')==='en'?'en':'cs'}catch(e){}
if(language==='en'){
 storage='truhlar1.highlights.v2.en';
 try{const saved=JSON.parse(localStorage.getItem(storage)||'[]');marks=Array.isArray(saved)?saved:[]}catch(e){marks=[]}
}
const originalThemeAction=themeBtn.onclick;
themeBtn.onclick=()=>{originalThemeAction();updateChrome()};
updateChrome();
applyTheme();
})();
